{% extends "base.html" %}
{% load wagtailimages_tags %}
{% load wagtailmarkdown %}

{% block content %}
  <article class="prose mx-auto">
    <h1>{{ person.name }}</h1>
    
    {% if person.photo %}
        <img src="/media/{{ person.photo }}" alt="{{ person.name }}" style="width: 200px;height: 200px;">
    {% endif %}

    {% if person.rank %}
        <p><strong>Rank:</strong> {{ person.rank }}</p>
    {% endif %}

    <div class="prose markdown-block">{{ person.biography | safe }}</div>
   </article>
  {% endblock %}
