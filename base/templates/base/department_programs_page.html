{% extends "base.html" %}
{% load wagtailcore_tags %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 py-10">
  <h1 class="text-4xl font-bold text-coset-gray-dark mb-8">{{ page.title }}</h1>

  <div class="flex gap-8 items-start">
    <main class="flex-1 min-w-0">
      {% if page.intro %}
      <div class="prose max-w-none mb-8 text-slate-700">
        {{ page.intro|richtext }}
      </div>
      {% endif %}

      <section class="mb-10">
        <h2 class="text-2xl font-bold text-coset-gray-dark mb-4">Academic Programs</h2>
        <div class="space-y-4">
          {% for p in programs %}
          <a href={{p.source_url}}>
          <div class="bg-white border border-gray-200 rounded-lg p-5 shadow-sm">
            <h3 class="text-lg font-semibold text-coset-gray-dark"> {{ p.name }}</h3>
          </div>
          </a>
          {% endfor %}
        </div>
      </section>

    </main>
    {% include "includes/department_sidebar.html" %}
  </div>
</div>
{% endblock %}
