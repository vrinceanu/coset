{% extends "base.html" %}
{% load wagtailcore_tags %}

{% block content %}
<article class="prose max-w-4xl mx-auto py-10">
    <h1>{{ page.title }}</h1>
    {% for block in page.body %}
        {% if block.block_type == 'paragraph' %}
            <div class="prose">
                {{ block.value|richtext }}
            </div>
        {% else %}
            {{ block }}
        {% endif %}
    {% endfor %}
</article>
{% endblock %}
